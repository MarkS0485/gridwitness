# GridWitness production stack (OVH box), fronted by the shared host nginx.
#   portal  127.0.0.1:8081   ASP.NET Core account portal (accounts, dashboard, API keys)
#   ingest  127.0.0.1:8001   Python FastAPI ingest engine (HA plugin + submitters + GDA acquirer)
#
# nginx (host-level, see D:\Work\ServerInfra) owns :80/:443, terminates TLS, and routes
# ingest.twinscrollgridbalancer.co.uk: /v1|/openapi|/schema -> ingest, everything else -> portal.
# The portal reaches ingest over the private compose network at http://ingest:8000 with GW_INTERNAL_KEY.
# Ports are published on loopback only so nothing but nginx can reach them.
#   deploy:  docker compose up -d --build   (needs a .env alongside — see .env.example)
#
# NOTE: the survey upload page accepts up to 100 files. Add `client_max_body_size 600m;` to the
# portal (gridwitness.twinscrollgridbalancer.co.uk) location in the host nginx config, matching the
# 600 MB batch ceiling in Portal Program.cs; the default 1 MB will otherwise 413 large batches.
name: gridwitness

services:
  ingest:
    build: ./server
    environment:
      GW_INTERNAL_KEY: ${GW_INTERNAL_KEY:?set GW_INTERNAL_KEY in .env}
      GW_DATA_DIR: /data
    volumes:
      - ./data/ingest:/data          # private SQLite + CSV staging + survey inbox/archive (back up encrypted)
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped

  # Out-of-band survey parser: drains staging/surveys/inbox that the portal upload fills, keeps only
  # frequency + voltage, appends to the same CSV staging tree the GDA acquirer reads. Shares the
  # ingest /data volume (reads the private DB for consent/tombstones; writes staging + archive).
  # PQDIF needs the .NET pqdif2csv tool, which is Windows-only — absent here, so PQDIF is skipped and
  # CSV/TXT still process (see survey_ingest/README.md).
  survey_ingest:
    build:
      context: .
      dockerfile: survey_ingest/Dockerfile
    environment:
      GW_DATA_DIR: /data
      GW_SURVEY_INTERVAL: ${GW_SURVEY_INTERVAL:-900}   # seconds between inbox drains
    volumes:
      - ./data/ingest:/data          # SAME volume as ingest — inbox/archive/staging/db all live here
    depends_on:
      - ingest
    restart: unless-stopped

  portal:
    build: ./Portal
    # .env supplies the shared SQL Server connection (ConnectionStrings__DefaultConnection) and
    # GW_INTERNAL_KEY. It is the same estate DB every app's SSO uses.
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GW_INGEST_BASE: http://ingest:8000
      GW_INTERNAL_KEY: ${GW_INTERNAL_KEY:?set GW_INTERNAL_KEY in .env}
      Ingest__PublicUrl: https://ingest.twinscrollgridbalancer.co.uk
      # ---- Shared estate SSO: one account works across the whole estate ----
      # Identity store = the SHARED SQL Server DB; ManageSchema=false so the portal never migrates the
      # shared Identity tables (TSGBWebsite owns them). Same key ring + app name + cookie + parent
      # domain as the rest of the estate. Connection string comes from .env.
      Database__Provider: "SqlServer"
      Database__ManageSchema: "false"
      Auth__ApplicationName: "TSGBWebsite"
      Auth__KeysDirectory: /keys
      Auth__CookieName: ".AspNetCore.Identity.Application"
      Auth__CookieDomain: ".twinscrollgridbalancer.co.uk"
      # Proton SMTP (same account as TSGBWebsite). Only the token is a secret in .env; the rest default
      # here. Leave SMTP_PASSWORD blank to disable sending (confirmation links log to stdout instead).
      Smtp__Host: ${SMTP_HOST:-smtp.protonmail.ch}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UseStartTls: ${SMTP_STARTTLS:-true}
      Smtp__User: ${SMTP_USER:-noreply@twinscrollgridbalancer.co.uk}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM:-noreply@twinscrollgridbalancer.co.uk}
      Smtp__FromName: ${SMTP_FROMNAME:-GridWitness}
    volumes:
      - ./data/portal:/app/App_Data   # dev-only SQLite dir; unused on the shared DB (kept for keys fallback)
      # Shared DataProtection key ring with TSGBWebsite (its App_Data/keys on the host), READ-ONLY —
      # the portal decrypts/issues the estate cookie with the live ring but never rotates it.
      - /home/ubuntu/apps/tsgb-website/data/keys:/keys:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - ingest
    # default: reaches ingest:8000. estate-data: reaches tsgb-mssql (the shared Identity DB).
    networks:
      - default
      - estate-data
    restart: unless-stopped

networks:
  estate-data:
    external: true
